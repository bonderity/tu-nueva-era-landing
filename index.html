<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#5C1A1A;
    color:#F5ECD7;
    font-family:Lora,Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  /* Viñeta suave para dar profundidad */
  body::after{
    content:"";
    position:absolute;
    top:0;right:0;bottom:0;left:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(61,15,15,.75) 100%);
    pointer-events:none;
  }
  .wrap{position:relative;z-index:1;max-width:560px}
  .marca{
    font-family:"Playfair Display",serif;
    font-style:italic;
    color:#C9A84C;
    font-size:15px;
    letter-spacing:.22em;
    text-transform:uppercase;
    margin:0 0 28px;
  }
  h1{
    font-family:"Playfair Display",serif;
    font-weight:700;
    color:#F5ECD7;
    font-size:clamp(34px,8vw,56px);
    line-height:1.15;
    margin:0 0 20px;
  }
  .sub{
    font-size:clamp(15px,4vw,18px);
    line-height:1.7;
    color:rgba(245,236,215,.85);
    margin:0 auto 32px;
    max-width:420px;
  }
  .rama{width:220px;max-width:70%;height:auto;color:#C9A84C;margin:0 auto 32px;display:block}
  .verso{
    font-family:"Playfair Display",serif;
    font-style:italic;
    color:#D4A5A5;
    font-size:14px;
    line-height:1.6;
    margin:0;
  }
  .pie{
    position:absolute;
    bottom:20px;left:0;right:0;
    color:rgba(212,165,165,.6);
    font-size:12px;
    z-index:1;
  }
  @media (prefers-reduced-motion:no-preference){
    .wrap{animation:aparecer .9s ease both}
    @keyframes aparecer{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>

  <main class="wrap">
    <p class="marca">Tu Nueva Era en Cristo</p>

    <h1>Algo nuevo está en camino.</h1>

    <p class="sub">
      Estamos preparando un espacio para la mujer que quiere una fe honesta,
      profunda y sin actuaciones. Muy pronto.
    </p>

    <svg class="rama" viewBox="0 0 280 32" fill="none" aria-hidden="true">

        <path d="M160 16 C152 26 140 28 132 24 C138 14 150 10 160 16Z" fill="currentColor" stroke="none"/>
        <circle cx="140" cy="16" r="3.5" fill="currentColor" stroke="none"/>
      </g>
    </svg>

    <p class="verso">“Ella está vestida de fuerza y dignidad.” — Proverbios 31:25</p>
  </main>

  <p class="pie">© <span id="anio">2026</span> Tu Nueva Era en Cristo · Bonderity LLC</p>

<script>
  document.getElementById('anio').textContent = new Date().getFullYear();
</script>
